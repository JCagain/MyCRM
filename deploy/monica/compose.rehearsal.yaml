# Always use an explicit, unique monica-rehearsal-* project name.
services:
  db: &database
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: fictional-root-test-only
      MARIADB_DATABASE: fictional
      MARIADB_USER: fictional
      MARIADB_PASSWORD: fictional-test-only
    volumes:
      - original-db:/var/lib/mysql
      - ../../monica/tests/Rehearsal:/tmp/rehearsal:ro
      - ../../.monica-tools/rehearsal:/backups
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
  recovery-db:
    <<: *database
    volumes:
      - recovery-db:/var/lib/mysql
      - ../../monica/tests/Rehearsal:/tmp/rehearsal:ro
      - ../../.monica-tools/rehearsal:/backups:ro
  legacy: &application
    image: monica:4.1.2@sha256:9319157715ef21ce4206b7efcc66a74ce4ae0eed8859905e69e1be6105e4ecef
    entrypoint: sh
    environment: &environment
      APP_ENV: testing
      APP_KEY: base64:NTrXToqFZJlv48dgPc+kNpc3SBt333TfDnF1mDShsBg=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: fictional
      DB_USERNAME: fictional
      DB_PASSWORD: fictional-test-only
      CACHE_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      CHECK_VERSION: "false"
      LOG_CHANNEL: stderr
    volumes:
      - original-storage:/var/www/html/storage
      - ../../monica/tests/Rehearsal:/tmp/rehearsal:ro
      - ../../.monica-tools/rehearsal:/backups
    depends_on:
      db: {condition: service_healthy}
  upgraded:
    <<: *application
    image: monica-local:4.1.2-organization-v1
  recovery:
    <<: *application
    environment:
      <<: *environment
      DB_HOST: recovery-db
    volumes:
      - recovery-storage:/var/www/html/storage
      - ../../monica/tests/Rehearsal:/tmp/rehearsal:ro
      - ../../.monica-tools/rehearsal:/backups:ro
    depends_on:
      recovery-db: {condition: service_healthy}
volumes:
  original-db:
  recovery-db:
  original-storage:
  recovery-storage:

name: monica-fictional
services:
  app:
    build:
      context: ../../monica
      dockerfile: Dockerfile.dev
    image: monica-fictional:4.1.2-dev
    ports: ["127.0.0.1:8081:80"]
    environment: &fictional
      APP_ENV: testing
      APP_KEY: base64:NTrXToqFZJlv48dgPc+kNpc3SBt333TfDnF1mDShsBg=
      APP_URL: http://127.0.0.1:8081
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: fictional
      DB_USERNAME: fictional
      DB_PASSWORD: fictional-test-only
      DB_TEST_DRIVER: mysql
      DB_TEST_HOST: db
      DB_TEST_DATABASE: fictional
      DB_TEST_USERNAME: fictional
      DB_TEST_PASSWORD: fictional-test-only
      CACHE_DRIVER: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
      CHECK_VERSION: "false"
      REQUIRES_SUBSCRIPTION: "false"
      APP_DISABLE_SIGNUP: "false"
      APP_SIGNUP_DOUBLE_OPTIN: "false"
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - fictional-storage:/var/www/html/storage
      - ./php-dev.ini:/usr/local/etc/php/conf.d/zz-fictional.ini:ro
      - ../../monica/app:/var/www/html/app:ro
      - ../../monica/database:/var/www/html/database:ro
      - ../../monica/routes:/var/www/html/routes:ro
      - ../../monica/tests:/var/www/html/tests:ro
      - ../../monica/phpunit.organization.xml:/var/www/html/phpunit.organization.xml:ro
      - ../../monica/resources/views:/var/www/html/resources/views:ro
      - ../../.monica-tools/fictional.vcf:/tmp/c2v-fictional.vcf:ro
      - ../../.monica-tools/handoff:/tmp/c2v-handoff:ro
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: fictional-root-test-only
      MARIADB_DATABASE: fictional
      MARIADB_USER: fictional
      MARIADB_PASSWORD: fictional-test-only
    volumes: ["fictional-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  fictional-db:
  fictional-storage:
